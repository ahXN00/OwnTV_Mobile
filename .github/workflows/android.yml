name: Android CI

# Modelled on the TV app's workflow (ahXN00/OwnTV), which this repo is the second consumer of core
# alongside. Two jobs:
#   check — unit tests + lint. Runs on everything, including pull requests. Gates the build.
#   build — assembles the APKs, and publishes a GitHub Release on v* tags. Never runs for a PR, so
#           PR branches only get the test/lint verdict, never an APK.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # required so tag builds can create a Release

# Resolving tv.own.owntv:core and :player-core from GitHub Packages. That registry belongs to a
# DIFFERENT repository (ahXN00/OwnTV_Core) and the built-in GITHUB_TOKEN is scoped to this one, so a
# personal access token with read:packages is required, stored as the GPR_TOKEN secret. GitHub's
# Maven registry demands credentials even for public packages, so this is not optional. Every Gradle
# step needs it, hence workflow level rather than per job.
#
# Note there is no owntv.corePath here: CI deliberately builds against the PINNED artifact, which is
# what a release actually ships. Local builds use the composite and ignore the pin entirely.
env:
  GITHUB_ACTOR: ${{ github.actor }}
  GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One variant, not `test`/`lint` across every flavor: standard+debug is the variant the JVM
      # tests are written against, and the ABI flavors differ only in the packaged native libs.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      # abortOnError = true in app/build.gradle.kts, so this fails the job on a lint error.
      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Upload test and lint reports
        if: always()   # the reports matter most when the step above failed
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    # PRs get the check job only — no APK, no release.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Set at runtime via $GITHUB_ENV in the "Name the APK" step. Declared here (empty) so static
      # linters don't flag the later ${{ env.APK_OUT }} references as "context access might be invalid".
      APK_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"                 # tag v0.1.0 -> 0.1.0
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))   # 0.1.0 -> 100
            [ "$CODE" -gt 0 ] || CODE=1
          else
            # Dev (non-tag) builds mirror the local-build fallback in app/build.gradle.kts:
            # pinned HIGH so a dev APK always installs over any published release
            # (no INSTALL_FAILED_VERSION_DOWNGRADE).
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Runs on every push (not just tags) so dev builds are also signed RELEASE builds —
          # required since R8 is on: only assembleRelease exercises shrinking and the keep rules,
          # and a release-signed dev APK installs straight over a published release for testing.
          # THE SAME KEYSTORE AS THE TV APP, deliberately: a certificate must be stable per
          # applicationId, not unique per app, and the two applicationIds differ. See CLAUDE.md.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "No KEYSTORE_BASE64 secret set — building a debug-signed APK."
          fi

      # Derives this release's edge key for the shared metadata/subtitle service, exactly as the TV
      # app does — both apps talk to the same worker. Falls back to the static OWNTV_EDGE_KEY, then
      # to "", where core uses its open base URL.
      - name: Derive the release edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            # No trailing newline in the input; the server derives it the same way.
            KEY=$(printf '%s' "$VERSION_NAME" \
              | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex \
              | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Derived the edge key for $VERSION_NAME."
          elif [ -n "$OWNTV_EDGE_KEY" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY" >> "$GITHUB_ENV"
            echo "No OWNTV_EDGE_MASTER — using the static edge key."
          else
            echo "No edge secret configured — the app will use the unprotected base URL."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # OWNTV_EDGE_KEY is exported into $GITHUB_ENV by the step above; app/build.gradle.kts reads
          # it as the env var it always did.
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building signed release APKs (both ABI flavors)"
            ./gradlew assembleRelease --stacktrace
            # Product flavors split the output by flavor subfolder:
            #   standard/release  -> arm (arm64-v8a + armeabi-v7a) — real phones and tablets
            #   x86_64/release    -> x86_64 — the emulator
            ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
            X86_SRC=$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)
            echo "Built arm:    $ARM_SRC"
            echo "Built x86_64: $X86_SRC"
            echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
            echo "X86_SRC=$X86_SRC" >> "$GITHUB_ENV"
          else
            echo "Building debug APK"
            ./gradlew assembleDebug
            SRC=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
            echo "Built: $SRC"
            echo "ARM_SRC=$SRC" >> "$GITHUB_ENV"
          fi

      # Proves the APK carries the certificate it is supposed to. The trap this guards against is
      # documented in CLAUDE.md: env vars beat Gradle properties, so a stale KEYSTORE_* in the
      # environment signs with the wrong key and nothing else notices.
      - name: Verify the signing certificate
        if: env.KEYSTORE_FILE != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$ARM_SRC"

      - name: Name the APK (OwnTV-Mobile-v<version>)
        run: |
          mkdir -p dist
          if [ "$IS_TAG" = "true" ]; then
            OUT="OwnTV-Mobile-v${{ steps.ver.outputs.name }}.apk"
          else
            OUT="OwnTV-Mobile-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT (arm: arm64-v8a + armeabi-v7a)"
          # The x86_64 APK is for the emulator, so it is only published on a tag and only under its
          # version name. There is no always-latest copy of either: this app has no in-app updater
          # and no Downloader-style sideload audience, which is what that fixed URL exists for on TV.
          if [ "$IS_TAG" = "true" ] && [ -n "$X86_SRC" ]; then
            cp "$X86_SRC" "dist/OwnTV-Mobile-x86_64-v${{ steps.ver.outputs.name }}.apk"
            echo "Packaged dist/OwnTV-Mobile-x86_64-v${{ steps.ver.outputs.name }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # Upload the whole dist/ so both the arm APK and the x86_64 APK are captured.
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG_APP.md
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # SHORT, bullet-only notes from CHANGELOG_APP.md — never CHANGELOG.md, which is the long
          # detailed one and would bury the release page in prose. Take "## <tag>" up to the next
          # "## v" header; the header may carry a date or "unreleased" tail ("## v0.1.0 — 2026-09-01")
          # or nothing at all.
          if [ -f CHANGELOG_APP.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG_APP.md > dist/RELEASE_NOTES.md || true
            # Trim leading/trailing blank lines.
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG_APP.md section for $TAG — publishing a placeholder body."
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md) for details." \
              > dist/RELEASE_NOTES.md
          fi
          echo "--- Release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: OwnTV Mobile ${{ github.ref_name }}
          files: |
            dist/${{ env.APK_OUT }}
            dist/OwnTV-Mobile-x86_64-v${{ steps.ver.outputs.name }}.apk
          body_path: dist/RELEASE_NOTES.md
          # Must stay false: it appends GitHub's auto commit/PR list under the body, burying the
          # hand-written notes.
          generate_release_notes: false
